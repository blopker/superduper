name: superduper
description: Configure your Super73 bike and keep its ride settings consistent.
publish_to: none
version: 1.0.5+64

environment:
  sdk: ^3.13.1

dependencies:
  crypto: ^3.0.7
  device_info_plus: ^13.2.0
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.12
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  share_plus: ^13.3.0
  signals: ^7.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  signals_lint: ^7.1.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/superduper.jpg
    - assets/superduper-nobg.png

flutter_launcher_icons:
  android: launcher_icon
  adaptive_icon_background: "#160A20"
  adaptive_icon_foreground: assets/superduper-nobg.png
  adaptive_icon_monochrome: assets/superduper-nobg.png
  ios: true
  image_path: assets/superduper.jpg
  image_path_ios: assets/superduper.jpg
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/superduper.jpg
